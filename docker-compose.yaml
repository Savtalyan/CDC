services:

  # ============================================================
  #  POSTGRES
  # ============================================================
  postgres:
    image: postgres:16
    container_name: postgres
    restart: on-failure

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/:/docker-entrypoint-initdb.d


  # ============================================================
  #  KAFKA CONTROLLER (KRaft) — no dependencies
  # ============================================================
  kafka_controller:
    image: apache/kafka:4.0.0
    container_name: kafka_controller

    ports:
      - "9093:9093"

    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 2@kafka_controller:9093


  # ============================================================
  #  KAFKA BROKER — waits for controller
  # ============================================================
  kafka_broker:
    image: apache/kafka:4.0.0
    container_name: kafka_broker

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_broker:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 2@kafka_controller:9093

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

    depends_on:
      kafka_controller:
        condition: service_started


  # ============================================================
  #  SCHEMA REGISTRY — waits for broker to be healthy
  # ============================================================
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    restart: on-failure

    ports:
      - "8081:8081"

    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka_broker:9092

    depends_on:
      kafka_broker:
        condition: service_healthy


  # ============================================================
  #  DEBEZIUM — waits for broker + schema registry
  # ============================================================
  debezium:
    build: ./infrastructure/debezium
    container_name: debezium
    restart: on-failure

    ports:
      - "8083:8083"

    environment:
      BOOTSTRAP_SERVERS: kafka_broker:9092

      GROUP_ID: 1

      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081

    depends_on:
      kafka_broker:
        condition: service_healthy
      schema-registry:
        condition: service_started
      postgres:
        condition: service_healthy


  # ============================================================
  #  SEEDER — waits for postgres + broker
  # ============================================================
  seeder:
    build: ./services/seeder
    container_name: seeder
    restart: on-failure
    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      kafka_broker:
        condition: service_healthy


  # ============================================================
  #  CONSUMER — waits for broker only
  # ============================================================
  consumer:
    build: ./services/consumer
    container_name: consumer
    restart: on-failure
    env_file:
      - .env

    depends_on:
      kafka_broker:
        condition: service_healthy


volumes:
  postgres_data: